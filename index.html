<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nordica Birth</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div id="login-screen" class="hidden">
    <form id="login-form">
      <div id="login-title">Nordica Birth</div>
      <input id="login-email" type="email" placeholder="Email" autocomplete="username" required />
      <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Log in</button>
      <div id="login-error"></div>
    </form>
  </div>

  <div id="app" class="hidden">
    <aside id="sidebar">
      <div id="sidebar-header">
        <div id="app-title">Nordica Birth</div>
      </div>
      <div id="board-list"></div>
      <button id="new-board-btn">+ New board</button>
      <button id="logout-btn">Log out</button>
    </aside>

    <main id="main">
      <header id="board-header">
        <div id="board-name" contenteditable="true" spellcheck="false"></div>
        <div id="zoom-controls">
          <button id="zoom-out" title="Zoom out">−</button>
          <span id="zoom-level">100%</span>
          <button id="zoom-in" title="Zoom in">+</button>
          <button id="zoom-reset" title="Reset view">Reset</button>
        </div>
      </header>

      <div id="toolbar"></div>

      <div id="canvas-viewport">
        <div id="world"></div>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
