<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nordica Birth</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div id="login-screen" class="hidden">
    <form id="login-form">
      <div id="login-title">Nordica Birth</div>
      <input id="login-email" type="email" placeholder="Email" autocomplete="username" required />
      <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Log in</button>
      <div id="login-error"></div>
    </form>
  </div>

  <div id="app" class="hidden">
    <aside id="sidebar">
      <div id="sidebar-header">
        <div id="app-title">Nordica Birth</div>
      </div>
      <div id="board-list"></div>
      <button id="new-board-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New board</span></button>
      <button id="logout-btn">Log out</button>
    </aside>

    <main id="main">
      <header id="board-header">
        <div id="board-name" contenteditable="true" spellcheck="false"></div>
        <div id="zoom-controls">
          <button id="zoom-out" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <button id="zoom-reset" title="Reset view" aria-label="Reset view"><span id="zoom-level">100%</span></button>
          <button id="zoom-in" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </header>

      <div id="toolbar"></div>

      <div id="canvas-viewport">
        <div id="world"></div>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
